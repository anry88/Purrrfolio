services:
  postgres:
    image: postgres:16-alpine
    container_name: purrrfolio-postgres
    environment:
      POSTGRES_DB: purrrfolio
      POSTGRES_USER: purrrfolio
      POSTGRES_PASSWORD: purrrfolio
    ports:
      - "5433:5432"
    volumes:
      - purrrfolio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purrrfolio -d purrrfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  purrrfolio_pg_data:
