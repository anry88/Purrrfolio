spring:
  application:
    name: purrrfolio
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/purrrfolio}
    username: ${DATABASE_USER:purrrfolio}
    password: ${DATABASE_PASSWORD:purrrfolio}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

purrrfolio:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  game-timezone: ${GAME_TIMEZONE:UTC}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    bot-username: ${TELEGRAM_BOT_USERNAME:purrrfolio_bot}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:false}
  economy:
    starter-packs: ${STARTER_PACKS:3}
    free-pack-interval-hours: ${FREE_PACK_INTERVAL_HOURS:23}
    free-card-interval-hours: ${FREE_CARD_INTERVAL_HOURS:3}
    cards-per-pack: ${CARDS_PER_PACK:3}
    stars-pricing:
      one-pack: ${STARS_ONE_PACK:5}
      three-packs: ${STARS_THREE_PACKS:12}
      five-packs: ${STARS_FIVE_PACKS:16}
      ten-packs: ${STARS_TEN_PACKS:25}
