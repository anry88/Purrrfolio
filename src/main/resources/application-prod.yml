spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:purrrfolio}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true

purrrfolio:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET}
    polling-enabled: false
