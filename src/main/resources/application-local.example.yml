spring:
  datasource:
    url: jdbc:h2:mem:purrrfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true

purrrfolio:
  public-base-url: http://localhost:8080
  telegram:
    bot-token: replace-me
    webhook-secret: replace-me
    bot-username: PurrrfolioBot
    polling-enabled: true
    admin-tg-id: 0
    payment-payload-secret: replace-me
  marketing:
    admin-token: replace-me-with-a-long-random-secret
    tiktok:
      client-key: replace-me
      client-secret: replace-me
      redirect-uri: http://localhost:8080/go/tiktok/oauth/callback
      scopes: user.info.basic,video.upload,video.publish,video.list
      demo-video-url: http://localhost:8080/assets/marketing/purrrfolio-demo.mp4
